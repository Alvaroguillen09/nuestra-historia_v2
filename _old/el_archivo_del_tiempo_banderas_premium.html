<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Archivo del Tiempo</title>

<style>
:root{
--gold:#d8ba78;
--bg1:#f2e8ff;
--bg2:#dac7ff;
--bg3:#c7b2ff;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:system-ui,sans-serif;
background:linear-gradient(180deg,var(--bg1),var(--bg2),var(--bg3));
overflow-x:hidden;
color:white;
}

canvas{
position:fixed;
inset:0;
z-index:-1;
}

.aurora{
position:fixed;
width:1000px;
height:1000px;
border-radius:50%;
filter:blur(140px);
opacity:.35;
z-index:-2;
animation:drift 30s ease-in-out infinite alternate;
}

.a1{background:#ffd6f5;left:-250px;top:-250px;}
.a2{background:#d7c2ff;right:-250px;top:10%;animation-duration:36s;}
.a3{background:#c9e4ff;left:25%;bottom:-300px;animation-duration:42s;}

@keyframes drift{
from{transform:translate(0,0) scale(1)}
to{transform:translate(180px,-100px) scale(1.2)}
}

.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.hero h1{
font-size:5rem;
color:#fff;
text-shadow:0 0 30px rgba(255,255,255,.4);
}

.archive{
width:min(1400px,95vw);
margin:auto;
padding-bottom:150px;
}

.record{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
position:sticky;
top:0;
}

.card{
width:min(1000px,92vw);
height:min(650px,80vh);
background:rgba(25,15,50,.72);
backdrop-filter:blur(30px);
border-radius:32px;
display:grid;
grid-template-columns:1.2fr 1fr;
overflow:hidden;
}

.left{
padding:60px;
display:flex;
flex-direction:column;
justify-content:center;
}

.code{color:var(--gold);letter-spacing:.4em;margin-bottom:20px;}
.country{font-size:4.5rem;font-family:Georgia,serif;}
.desc{margin-top:20px;line-height:1.8;opacity:.85}
.enter{
margin-top:30px;
display:inline-block;
background:var(--gold);
color:#111;
padding:14px 24px;
border-radius:999px;
text-decoration:none;
font-weight:bold;
align-self:flex-start;
}

.right{
position:relative;
display:flex;
justify-content:center;
align-items:center;
border-left:1px solid rgba(255,255,255,.08);
}

.ring{
position:absolute;
border-radius:50%;
border:1px solid rgba(216,186,120,.35);
animation:spin 30s linear infinite;
}

.ring1{width:280px;height:280px;}
.ring2{width:380px;height:380px;animation-direction:reverse;animation-duration:42s;}

.dot{
width:12px;
height:12px;
background:var(--gold);
border-radius:50%;
position:absolute;
top:-6px;
left:50%;
transform:translateX(-50%);
box-shadow:0 0 25px var(--gold);
}

.flag-container{
position:absolute;
width:190px;
height:190px;
border-radius:50%;
overflow:hidden;
background:rgba(255,255,255,.08);
backdrop-filter:blur(16px);
border:2px solid rgba(255,255,255,.18);
box-shadow:0 0 60px rgba(216,186,120,.15);
animation:flagSpin 28s linear infinite;
}

.flag{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%;
}

.flag-container::before{
content:'';
position:absolute;
top:0;
left:-120%;
width:60%;
height:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);
transform:skewX(-20deg);
animation:shine 6s infinite;
}

@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes flagSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes shine{from{left:-120%}to{left:180%}}
</style>
</head>
<body>

<div class="aurora a1"></div>
<div class="aurora a2"></div>
<div class="aurora a3"></div>
<canvas id="stars"></canvas>

<section class="hero">
<h1>El Archivo del Tiempo</h1>
</section>

<div class="archive" id="archive"></div>

<script>
const places=[
["AR-001","España","espana.html","El comienzo","flags/es.png"],
["AR-002","Hungría","hungria.html","Un recuerdo especial","flags/hu.png"],
["AR-003","Austria","austria.html","Elegancia y música","flags/at.png"],
["AR-004","Irlanda","irlanda.html","Verde infinito","flags/ie.png"],
["AR-005","Finlandia","finlandia.html","Mirando al norte","flags/fi.png"],
["AR-006","Estonia","estonia.html","Nuevos horizontes","flags/ee.png"],
["AR-007","Italia","italia.html","Arte y nosotros","flags/it.png"],
["AR-008","Alemania","alemania.html","Aventuras inesperadas","flags/de.png"],
["AR-009","Francia","francia.html","Momentos inolvidables","flags/fr.png"],
["AR-010","Escocia","escocia.html","Paisajes legendarios","flags/scotland.png"],
["AR-011","Vaticano","vaticano.html","Un rincón eterno","flags/vatican.png"],
["AR-012","Eslovaquia","eslovaquia.html","Descubriendo juntos","flags/sk.png"],
["AR-013","República Checa","republica-checa.html","Calles mágicas","flags/cz.png"]
];

const archive=document.getElementById('archive');

places.forEach(p=>{
archive.innerHTML += `
<section class="record">
<div class="card">
<div class="left">
<div class="code">${p[0]}</div>
<div class="country">${p[1]}</div>
<div class="desc">${p[3]}. Este recuerdo ha sido preservado dentro del archivo permanente de nuestra historia.</div>
<a class="enter" href="${p[2]}">Abrir recuerdo</a>
</div>

<div class="right">
<div class="ring ring1"><div class="dot"></div></div>
<div class="ring ring2"><div class="dot"></div></div>

<div class="flag-container">
<img class="flag" src="${p[4]}" alt="${p[1]}">
</div>
</div>
</div>
</section>`;
});

const stars=document.getElementById('stars');
const ctx=stars.getContext('2d');

function resize(){
stars.width=innerWidth;
stars.height=innerHeight;
}
resize();
addEventListener('resize',resize);

const particles=[];
for(let i=0;i<260;i++){
particles.push({
x:Math.random()*innerWidth,
y:Math.random()*innerHeight,
r:Math.random()*2+0.6,
vx:(Math.random()-0.5)*0.08,
vy:Math.random()*0.15+0.03
});
}

function animate(){
ctx.clearRect(0,0,stars.width,stars.height);

particles.forEach(p=>{
p.x+=p.vx;
p.y+=p.vy;

if(p.y>innerHeight+20) p.y=-20;
if(p.x>innerWidth+20) p.x=-20;
if(p.x<-20) p.x=innerWidth+20;

const glow=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*8);
glow.addColorStop(0,'rgba(255,255,255,.95)');
glow.addColorStop(1,'rgba(255,255,255,0)');

ctx.fillStyle=glow;
ctx.beginPath();
ctx.arc(p.x,p.y,p.r*8,0,Math.PI*2);
ctx.fill();

ctx.fillStyle='rgba(255,255,255,.95)';
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fill();
});

requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
