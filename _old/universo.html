<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nuestro Universo</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#06070d;font-family:Outfit,sans-serif}
#bg{position:fixed;inset:0}
#overlay{
position:absolute;inset:0;
background:radial-gradient(circle at center,rgba(80,20,40,.15),rgba(0,0,0,.85));
pointer-events:none;
}
#intro{
position:absolute;inset:0;
display:flex;flex-direction:column;
justify-content:center;align-items:center;
color:white;z-index:10;
text-align:center;
animation:fadeIntro 5s forwards;
}
#intro h1{
font-family:"Cormorant Garamond",serif;
font-size:5rem;
font-weight:300;
}
#intro p{
margin-top:15px;
opacity:.85;
letter-spacing:2px;
}
@keyframes fadeIntro{
0%,70%{opacity:1}
100%{opacity:0;visibility:hidden}
}
#centerText{
position:absolute;
top:50%;left:50%;
transform:translate(-50%,-50%);
color:white;
z-index:5;
text-align:center;
pointer-events:none;
}
#centerText h2{
font-family:"Cormorant Garamond",serif;
font-size:4rem;
font-weight:300;
}
#centerText p{
opacity:.7;
letter-spacing:3px;
}

.country{
position:absolute;
width:16px;height:16px;
border-radius:50%;
background:#f2d09a;
box-shadow:0 0 15px #f2d09a,0 0 35px #f2d09a;
cursor:pointer;
transition:.4s;
z-index:6;
}
.country:hover{
transform:scale(1.8);
}
.label{
position:absolute;
color:white;
font-size:.85rem;
white-space:nowrap;
transform:translate(18px,-5px);
opacity:.85;
pointer-events:none;
}
#lineCanvas{
position:absolute;
inset:0;
z-index:4;
}
#quote{
position:absolute;
left:50%;
bottom:60px;
transform:translateX(-50%);
color:#f4e6c7;
font-family:"Cormorant Garamond",serif;
font-size:1.6rem;
opacity:.8;
z-index:7;
text-align:center;
}
#travelOverlay{
position:absolute;
inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
opacity:0;
pointer-events:none;
transition:1.2s;
z-index:20;
}
#travelOverlay.active{
opacity:1;
}
#travelOverlay h2{
font-family:"Cormorant Garamond",serif;
font-size:5rem;
color:#111;
}
#travelOverlay p{
font-size:1.2rem;
color:#333;
margin-top:15px;
}
</style>
</head>
<body>

<div id="bg"></div>
<canvas id="lineCanvas"></canvas>

<div id="intro">
<h1>Gabriela</h1>
<p>Cada país guarda un recuerdo. Cada recuerdo cuenta nuestra historia.</p>
</div>

<div id="centerText">
<h2>Gabriela ❤ Álvaro</h2>
<p>NUESTRO UNIVERSO</p>
</div>

<div id="quote">Explora una estrella para continuar el viaje...</div>

<div id="travelOverlay">
<h2 id="destName"></h2>
<p id="destQuote"></p>
</div>

<div id="overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});

renderer.setSize(window.innerWidth,window.innerHeight);
document.getElementById("bg").appendChild(renderer.domElement);

const starsGeometry=new THREE.BufferGeometry();
const starCount=5000;

const positions=[];
for(let i=0;i<starCount;i++){
positions.push((Math.random()-0.5)*1000);
positions.push((Math.random()-0.5)*1000);
positions.push((Math.random()-0.5)*1000);
}

starsGeometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));

const starsMaterial=new THREE.PointsMaterial({
size:1,
color:0xffffff
});

const stars=new THREE.Points(starsGeometry,starsMaterial);
scene.add(stars);

camera.position.z=120;

function animate(){
requestAnimationFrame(animate);
stars.rotation.y+=0.0002;
stars.rotation.x+=0.00005;
renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

const countries=[
{name:"España",file:"espana.html",quote:"Donde todo comenzó.",x:30,y:65},
{name:"Italia",file:"italia.html",quote:"La belleza compartida.",x:40,y:75},
{name:"Francia",file:"francia.html",quote:"La ciudad de los sueños.",x:55,y:72},
{name:"Hungría",file:"hungria.html",quote:"Un recuerdo inesperado.",x:62,y:60},
{name:"Austria",file:"austria.html",quote:"Música para dos.",x:68,y:50},
{name:"Albania",file:"albania.html",quote:"Descubriendo juntos.",x:70,y:68},
{name:"Irlanda",file:"irlanda.html",quote:"Verde infinito.",x:25,y:40},
{name:"Alemania",file:"alemania.html",quote:"Nuevas aventuras.",x:45,y:35},
{name:"Eslovaquia",file:"eslovaquia.html",quote:"Un rincón especial.",x:60,y:30},
{name:"Rep. Checa",file:"republica-checa.html",quote:"Calles mágicas.",x:72,y:35},
{name:"Estonia",file:"estonia.html",quote:"El norte nos esperaba.",x:80,y:25},
{name:"Finlandia",file:"finlandia.html",quote:"Auroras y recuerdos.",x:60,y:15},
{name:"Escocia",file:"escocia.html",quote:"Tierras legendarias.",x:30,y:20},
{name:"Vaticano",file:"vaticano.html",quote:"Pequeño pero eterno.",x:50,y:55}
];

const canvas=document.getElementById("lineCanvas");
const ctx=canvas.getContext("2d");

function resizeCanvas(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
drawLines();
}
window.addEventListener("resize",resizeCanvas);

function drawLines(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.strokeStyle="rgba(255,220,180,.25)";
ctx.lineWidth=1;

for(let i=0;i<countries.length-1;i++){
const a=countries[i];
const b=countries[i+1];

ctx.beginPath();
ctx.moveTo(a.x/100*window.innerWidth,a.y/100*window.innerHeight);
ctx.lineTo(b.x/100*window.innerWidth,b.y/100*window.innerHeight);
ctx.stroke();
}
}

countries.forEach(c=>{
const node=document.createElement("div");
node.className="country";
node.style.left=c.x+"%";
node.style.top=c.y+"%";

const label=document.createElement("div");
label.className="label";
label.innerText=c.name;

node.appendChild(label);

node.addEventListener("mouseenter",()=>{
document.getElementById("quote").innerText=c.quote;
});

node.addEventListener("click",()=>{
const overlay=document.getElementById("travelOverlay");
document.getElementById("destName").innerText=c.name;
document.getElementById("destQuote").innerText=c.quote;

overlay.classList.add("active");

setTimeout(()=>{
window.location.href=c.file;
},2200);
});

document.body.appendChild(node);
});

resizeCanvas();
</script>

</body>
</html>
