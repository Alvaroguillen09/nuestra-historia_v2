<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>El Archivo del Tiempo - Aurora Edition</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
--gold:#d8ba78;
--line:rgba(255,255,255,.08);
}

body{
font-family:Inter,sans-serif;
background:#12051f;
color:white;
overflow-x:hidden;
}

/* NUEVO FONDO AURORA */

#bg{
position:fixed;
inset:0;
z-index:-3;
background:
linear-gradient(180deg,#1d0930,#2d1150,#1c0d33,#12051f);
}

.aurora{
position:fixed;
width:900px;
height:900px;
border-radius:50%;
filter:blur(120px);
opacity:.45;
animation:float 18s infinite alternate ease-in-out;
z-index:-2;
}

.a1{
background:#c78cff;
left:-250px;
top:-250px;
}

.a2{
background:#8e7bff;
right:-250px;
top:20%;
animation-duration:24s;
}

.a3{
background:#ff9ee8;
left:30%;
bottom:-300px;
animation-duration:20s;
}

@keyframes float{
from{transform:translate(0,0) scale(1)}
to{transform:translate(120px,-80px) scale(1.25)}
}

#stars{
position:fixed;
inset:0;
z-index:-1;
pointer-events:none;
}

.progress{
position:fixed;
top:0;
left:0;
height:2px;
width:0;
background:linear-gradient(90deg,#ffffff,#d8ba78);
z-index:999;
box-shadow:0 0 20px #fff;
}

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
}

.hero h1{
font-family:"Cormorant Garamond",serif;
font-size:min(11vw,8rem);
font-weight:600;
text-shadow:0 0 30px rgba(255,255,255,.15);
}

.hero p{
margin-top:20px;
opacity:.75;
letter-spacing:.3em;
}

.archive{
width:min(1400px,95vw);
margin:auto;
padding-bottom:200px;
}

.record{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
position:sticky;
top:0;
}

.card{
width:min(1000px,92vw);
height:min(650px,80vh);
background:rgba(12,10,25,.72);
backdrop-filter:blur(30px);
border:1px solid rgba(255,255,255,.08);
border-radius:32px;
overflow:hidden;
display:grid;
grid-template-columns:1.2fr 1fr;
box-shadow:
0 0 0 1px rgba(255,255,255,.03),
0 30px 120px rgba(0,0,0,.45);
}

.left{
padding:60px;
display:flex;
flex-direction:column;
justify-content:center;
}

.code{
color:var(--gold);
letter-spacing:.4em;
font-size:.8rem;
margin-bottom:20px;
}

.country{
font-family:"Cormorant Garamond",serif;
font-size:5rem;
line-height:.9;
}

.desc{
margin-top:25px;
opacity:.78;
line-height:1.9;
max-width:500px;
}

.enter{
margin-top:35px;
display:inline-block;
text-decoration:none;
background:var(--gold);
color:#111;
padding:14px 24px;
border-radius:999px;
font-weight:700;
align-self:flex-start;
}

.right{
border-left:1px solid var(--line);
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

.year{
font-size:min(18vw,10rem);
font-weight:700;
opacity:.08;
position:absolute;
}

.ring{
width:280px;
height:280px;
border-radius:50%;
border:1px solid rgba(216,186,120,.35);
position:absolute;
animation:spin 30s linear infinite;
}

.ring:nth-child(2){
width:360px;
height:360px;
animation-duration:42s;
animation-direction:reverse;
}

.dot{
width:10px;
height:10px;
background:var(--gold);
border-radius:50%;
position:absolute;
top:-5px;
left:50%;
transform:translateX(-50%);
box-shadow:0 0 20px var(--gold);
}

@keyframes spin{
from{transform:rotate(0)}
to{transform:rotate(360deg)}
}

.final{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

.final h2{
font-family:"Cormorant Garamond",serif;
font-size:min(9vw,6rem);
}

.final p{
margin-top:20px;
opacity:.75;
}

@media(max-width:900px){
.card{
grid-template-columns:1fr;
height:auto;
}
.right{
min-height:300px;
border-left:none;
border-top:1px solid var(--line);
}
.record{
height:auto;
padding:60px 0;
position:relative;
}
.country{
font-size:3.5rem;
}
}
</style>
</head>
<body>

<div id="bg"></div>
<div class="aurora a1"></div>
<div class="aurora a2"></div>
<div class="aurora a3"></div>

<canvas id="stars"></canvas>

<div class="progress" id="progress"></div>

<section class="hero">
<div>
<h1>El Archivo del Tiempo</h1>
<p>TODOS LOS MOMENTOS QUE MERECEN SER CONSERVADOS</p>
</div>
</section>

<div class="archive" id="archive"></div>

<section class="final">
<div>
<h2>Clasificación incompleta.</h2>
<p>Se siguen registrando nuevos recuerdos...</p>
</div>
</section>

<script>
const places=[
["AR-001","España","espana.html","El comienzo"],
["AR-002","Hungría","hungria.html","Un recuerdo especial"],
["AR-003","Austria","austria.html","Elegancia y música"],
["AR-004","Irlanda","irlanda.html","Verde infinito"],
["AR-005","Finlandia","finlandia.html","Mirando al norte"],
["AR-006","Estonia","estonia.html","Nuevos horizontes"],
["AR-007","Italia","italia.html","Arte y nosotros"],
["AR-008","Alemania","alemania.html","Aventuras inesperadas"],
["AR-009","Francia","francia.html","Momentos inolvidables"],
["AR-010","Escocia","escocia.html","Paisajes legendarios"],
["AR-011","Vaticano","vaticano.html","Un rincón eterno"],
["AR-012","Eslovaquia","eslovaquia.html","Descubriendo juntos"],
["AR-013","República Checa","republica-checa.html","Calles mágicas"]
];

const archive=document.getElementById('archive');

places.forEach((p,i)=>{
const el=document.createElement('section');
el.className='record';

el.innerHTML=`
<div class="card">
<div class="left">
<div class="code">${p[0]}</div>
<div class="country">${p[1]}</div>
<div class="desc">${p[3]}. Este recuerdo ha sido preservado dentro del archivo permanente de nuestra historia.</div>
<a href="${p[2]}" class="enter">Abrir recuerdo</a>
</div>
<div class="right">
<div class="year">${String(i+1).padStart(2,'0')}</div>
<div class="ring"><div class="dot"></div></div>
<div class="ring"><div class="dot"></div></div>
</div>
</div>`;

archive.appendChild(el);
});

addEventListener('scroll',()=>{
const max=document.documentElement.scrollHeight-innerHeight;
document.getElementById('progress').style.width=(scrollY/max*100)+'%';
});


const stars=document.getElementById("stars");
const sctx=stars.getContext("2d");

function resizeStars(){
stars.width=innerWidth;
stars.height=innerHeight;
}
resizeStars();
window.addEventListener('resize',resizeStars);

const particles=[];
for(let i=0;i<220;i++){
particles.push({
x:Math.random()*innerWidth,
y:Math.random()*innerHeight,
r:Math.random()*2,
v:Math.random()*0.3+0.05
});
}

function animateStars(){
sctx.clearRect(0,0,stars.width,stars.height);

for(const p of particles){
p.y+=p.v;

if(p.y>innerHeight){
p.y=0;
}

const glow=sctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*6);
glow.addColorStop(0,'rgba(255,255,255,.95)');
glow.addColorStop(.35,'rgba(255,255,255,.25)');
glow.addColorStop(1,'rgba(255,255,255,0)');

sctx.fillStyle=glow;
sctx.beginPath();
sctx.arc(p.x,p.y,p.r*6,0,Math.PI*2);
sctx.fill();

sctx.fillStyle='rgba(255,255,255,.95)';
sctx.beginPath();
sctx.arc(p.x,p.y,p.r,0,Math.PI*2);
sctx.fill();
}

requestAnimationFrame(animateStars);
}

animateStars();


</script>

</body>
</html>
