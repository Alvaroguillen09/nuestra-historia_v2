<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>El Camino de Nosotros</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:wght@300;500;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#e2c27a;--bg:#07111d;}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Outfit,sans-serif;background:radial-gradient(circle at top,#10233f,#040912 70%);color:#fff;overflow-x:hidden}
canvas{position:fixed;inset:0;pointer-events:none}
.hero{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.hero h1{font-family:Cinzel,serif;font-size:min(9vw,7rem)}
.hero p{letter-spacing:.4em;opacity:.8}
.timeline{position:relative;width:100%;max-width:1200px;margin:auto;padding-bottom:200px}
svg.route{position:absolute;left:50%;transform:translateX(-50%);width:900px;height:7600px;overflow:visible}
.path-bg{stroke:rgba(255,255,255,.08);stroke-width:10;fill:none}
.path-glow{stroke:var(--gold);stroke-width:8;fill:none;filter:drop-shadow(0 0 12px var(--gold))}
.stop{position:relative;height:520px}
.node{
position:absolute;width:340px;padding:24px;
background:rgba(255,255,255,.06);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.15);
border-radius:28px;
opacity:0;transform:translateY(60px) scale(.92);
transition:1.2s;
}
.visible{opacity:1;transform:translateY(0) scale(1)}
.node h2{font-family:Cormorant Garamond,serif;font-size:2.4rem;color:var(--gold)}
.node p{opacity:.8;margin:10px 0 18px}
.node a{
display:inline-block;text-decoration:none;
background:var(--gold);color:#111;
padding:12px 18px;border-radius:999px;font-weight:700
}
.dot{
position:absolute;width:22px;height:22px;border-radius:50%;
background:var(--gold);
box-shadow:0 0 25px var(--gold);
left:50%;transform:translateX(-50%);
}
.final{
height:100vh;display:flex;align-items:center;justify-content:center;
text-align:center;font-family:Cormorant Garamond,serif;font-size:4rem
}
</style>
</head>
<body>

<audio id="music" autoplay loop>
<source src="audio/tema.mp3" type="audio/mpeg">
</audio>

<canvas id="stars"></canvas>

<section class="hero">
<h1>El Camino de Nosotros</h1>
<p>2021 → ∞</p>
</section>

<div class="timeline" id="timeline">
<svg class="route" viewBox="0 0 900 7600">
<path id="mainPath" class="path-bg"
d="M450 120 C250 300,650 500,450 700
S250 1100,450 1300
S650 1700,450 1900
S250 2300,450 2500
S650 2900,450 3100
S250 3500,450 3700
S650 4100,450 4300
S250 4700,450 4900
S650 5300,450 5500
S250 5900,450 6100
S650 6500,450 6700
S250 7100,450 7400"/>
<path id="drawPath" class="path-glow"
d="M450 120 C250 300,650 500,450 700
S250 1100,450 1300
S650 1700,450 1900
S250 2300,450 2500
S650 2900,450 3100
S250 3500,450 3700
S650 4100,450 4300
S250 4700,450 4900
S650 5300,450 5500
S250 5900,450 6100
S650 6500,450 6700
S250 7100,450 7400"/>
</svg>
</div>

<section class="final">
<div>
<div>Nuestra historia todavía no tiene final.</div>
<div style="font-size:2rem;opacity:.7">2021 → ∞</div>
</div>
</section>

<script>
const places=[
["España","espana.html","El comienzo"],
["Hungría","hungria.html","Un recuerdo especial"],
["Austria","austria.html","Elegancia y música"],
["Irlanda","irlanda.html","Verde infinito"],
["Finlandia","finlandia.html","Mirando al norte"],
["Estonia","estonia.html","Nuevos horizontes"],
["Italia","italia.html","Arte y nosotros"],
["Alemania","alemania.html","Aventuras inesperadas"],
["Francia","francia.html","Momentos inolvidables"],
["Escocia","escocia.html","Paisajes legendarios"],
["Vaticano","vaticano.html","Un rincón eterno"],
["Eslovaquia","eslovaquia.html","Descubriendo juntos"],
["República Checa","republica-checa.html","Calles mágicas"]
];

const timeline=document.getElementById('timeline');

places.forEach((p,i)=>{
const y=180+i*560;
const side=i%2===0?'left':'right';

const dot=document.createElement('div');
dot.className='dot';
dot.style.top=y+'px';
timeline.appendChild(dot);

const node=document.createElement('div');
node.className='node';
node.style.top=(y-70)+'px';
node.style[side]='calc(50% + 120px)';
if(side==='left') node.style.left='auto',node.style.right='calc(50% + 120px)';

node.innerHTML=`
<h2>${p[0]}</h2>
<p>${p[2]}</p>
<p>Un capítulo de nuestra historia, conservado para siempre.</p>
<a href="${p[1]}">Entrar al recuerdo</a>`;

timeline.appendChild(node);
});

const obs=new IntersectionObserver(entries=>{
entries.forEach(e=>{
if(e.isIntersecting)e.target.classList.add('visible');
});
},{threshold:.25});

document.querySelectorAll('.node').forEach(n=>obs.observe(n));

const path=document.getElementById('drawPath');
const len=path.getTotalLength();
path.style.strokeDasharray=len;
path.style.strokeDashoffset=len;

addEventListener('scroll',()=>{
const h=document.documentElement.scrollHeight-innerHeight;
const p=scrollY/h;
path.style.strokeDashoffset=len-(len*p);

document.querySelectorAll('.node').forEach((n,i)=>{
const r=n.getBoundingClientRect();
const center=Math.abs(r.top-innerHeight/2);
const scale=Math.max(.9,1.08-center/1200);
n.style.transform=`scale(${scale})`;
});
});

const stars=document.getElementById('stars');
const ctx=stars.getContext('2d');
function resize(){stars.width=innerWidth;stars.height=innerHeight}
resize();addEventListener('resize',resize);

const pts=[...Array(220)].map(()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2}));
let mouse={x:0,y:0};
addEventListener('mousemove',e=>mouse=e);

function animate(){
ctx.clearRect(0,0,stars.width,stars.height);

pts.forEach(p=>{
p.y+=0.15;
if(p.y>innerHeight)p.y=0;
ctx.fillStyle='rgba(255,255,255,.8)';
ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
});

ctx.fillStyle='rgba(226,194,122,.8)';
ctx.beginPath();
ctx.arc(mouse.x,mouse.y,3,0,Math.PI*2);
ctx.fill();

requestAnimationFrame(animate);
}
animate();

document.addEventListener('click',()=>{
document.getElementById('music').play().catch(()=>{});
},{once:true});
</script>
</body>
</html>
