<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Museo de Nosotros</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
--gold:#d9bc7c;
--bg:#080808;
--glass:rgba(255,255,255,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
background:var(--bg);
color:white;
font-family:Outfit,sans-serif;
overflow-x:hidden;
}
body::before{
content:'';
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%,rgba(217,188,124,.08),transparent 25%),
radial-gradient(circle at 80% 70%,rgba(255,255,255,.03),transparent 35%);
pointer-events:none;
}

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
}
.hero-box{
max-width:900px;
}
.hero h1{
font-family:"Cormorant Garamond",serif;
font-size:clamp(4rem,10vw,9rem);
font-weight:600;
}
.hero p{
margin-top:20px;
font-size:1.2rem;
opacity:.7;
letter-spacing:.2em;
}

.gallery{
width:min(1400px,95vw);
margin:auto;
padding-bottom:150px;
}

.room{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
position:relative;
}

.frame{
width:min(1000px,90vw);
height:min(600px,75vh);
border:1px solid rgba(217,188,124,.25);
background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.02));
backdrop-filter:blur(10px);
display:grid;
grid-template-columns:1fr 1fr;
overflow:hidden;
box-shadow:
0 0 0 1px rgba(255,255,255,.05),
0 40px 120px rgba(0,0,0,.5);
opacity:0;
transform:translateY(80px) scale(.95);
transition:1.2s ease;
}

.room.visible .frame{
opacity:1;
transform:translateY(0) scale(1);
}

.art{
position:relative;
display:flex;
justify-content:center;
align-items:center;
background:
radial-gradient(circle at center,rgba(217,188,124,.15),transparent 60%);
}

.roman{
font-family:"Cormorant Garamond",serif;
font-size:min(18vw,12rem);
color:rgba(217,188,124,.25);
}

.info{
display:flex;
flex-direction:column;
justify-content:center;
padding:50px;
}

.country{
font-family:"Cormorant Garamond",serif;
font-size:4rem;
line-height:1;
}

.subtitle{
margin-top:12px;
opacity:.65;
font-size:1.1rem;
letter-spacing:.1em;
}

.line{
width:120px;
height:1px;
background:var(--gold);
margin:25px 0;
}

.text{
opacity:.8;
line-height:1.8;
}

.enter{
margin-top:30px;
align-self:flex-start;
text-decoration:none;
color:#111;
background:var(--gold);
padding:14px 24px;
border-radius:999px;
font-weight:700;
transition:.3s;
}

.enter:hover{
transform:translateY(-2px);
}

.final{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
}

.final h2{
font-family:"Cormorant Garamond",serif;
font-size:clamp(3rem,8vw,7rem);
}

.final p{
margin-top:20px;
opacity:.7;
font-size:1.3rem;
}

.progress{
position:fixed;
top:0;
left:0;
height:3px;
background:var(--gold);
width:0;
z-index:100;
}

@media(max-width:900px){
.frame{
grid-template-columns:1fr;
height:auto;
}
.art{height:250px}
.country{font-size:3rem}
.room{
height:auto;
padding:60px 0;
}
}
</style>
</head>
<body>

<audio id="music" loop autoplay>
<source src="audio/tema.mp3" type="audio/mpeg">
</audio>

<div class="progress" id="progress"></div>

<section class="hero">
<div class="hero-box">
<h1>Museo de Nosotros</h1>
<p>BIENVENIDA AL LUGAR DONDE GUARDO TODO LO QUE NUNCA QUIERO OLVIDAR</p>
</div>
</section>

<div class="gallery" id="gallery"></div>

<section class="final">
<div>
<h2>Nuestra historia sigue escribiéndose.</h2>
<p>2021 → ∞</p>
</div>
</section>

<script>
const places=[
["I","España","espana.html","El comienzo"],
["II","Hungría","hungria.html","Un recuerdo especial"],
["III","Austria","austria.html","Elegancia y música"],
["IV","Irlanda","irlanda.html","Verde infinito"],
["V","Finlandia","finlandia.html","Mirando al norte"],
["VI","Estonia","estonia.html","Nuevos horizontes"],
["VII","Italia","italia.html","Arte y nosotros"],
["VIII","Alemania","alemania.html","Aventuras inesperadas"],
["IX","Francia","francia.html","Momentos inolvidables"],
["X","Escocia","escocia.html","Paisajes legendarios"],
["XI","Vaticano","vaticano.html","Un rincón eterno"],
["XII","Eslovaquia","eslovaquia.html","Descubriendo juntos"],
["XIII","República Checa","republica-checa.html","Calles mágicas"]
];

const gallery=document.getElementById('gallery');

places.forEach(p=>{
const room=document.createElement('section');
room.className='room';

room.innerHTML=`
<div class="frame">
<div class="art">
<div class="roman">${p[0]}</div>
</div>
<div class="info">
<div class="country">${p[1]}</div>
<div class="subtitle">${p[3]}</div>
<div class="line"></div>
<div class="text">
Cada sala representa un capítulo irrepetible.
No es un destino. Es un momento de nuestra historia.
</div>
<a href="${p[2]}" class="enter">Entrar al recuerdo</a>
</div>
</div>`;

gallery.appendChild(room);
});

const observer=new IntersectionObserver(entries=>{
entries.forEach(e=>{
if(e.isIntersecting)e.target.classList.add('visible');
});
},{threshold:.3});

document.querySelectorAll('.room').forEach(r=>observer.observe(r));

window.addEventListener('scroll',()=>{
const max=document.documentElement.scrollHeight-innerHeight;
const p=(scrollY/max)*100;
document.getElementById('progress').style.width=p+'%';
});

document.addEventListener('click',()=>{
document.getElementById('music').play().catch(()=>{});
},{once:true});
</script>

</body>
</html>
