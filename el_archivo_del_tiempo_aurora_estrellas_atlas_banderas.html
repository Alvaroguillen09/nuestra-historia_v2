<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; script-src 'self' 'unsafe-inline';">
<title>El Archivo del Tiempo - Aurora Edition</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
--gold:rgb(214, 217, 255);
--line:rgba(255,255,255,.08);
}

body{
font-family:Inter,sans-serif;
background-color: rgb(159, 161, 255);
color:white;
overflow-x:hidden;
}

/* NUEVO FONDO AURORA */

#bg{
position:fixed;
inset:0;
z-index:-3;
background-color: rgb(159, 161, 255);
}

.aurora{
position:fixed;
width:900px;
height:900px;
border-radius:50%;
filter:blur(120px);
opacity:.45;
animation:float 18s infinite alternate ease-in-out;
z-index:-2;
}

.a1{
background-color: rgb(159, 161, 255);
left:-250px;
top:-250px;
}

.a2{
background-color: rgb(159, 161, 255);
right:-250px;
top:20%;
animation-duration:24s;
}

.a3{
background-color: rgb(159, 161, 255);
left:30%;
bottom:-300px;
animation-duration:20s;
}

@keyframes float{
from{transform:translate(0,0) scale(1)}
to{transform:translate(120px,-80px) scale(1.25)}
}

#stars{
position:fixed;
inset:0;
z-index:-1;
pointer-events:none;
}

.progress{
position:fixed;
top:0;
left:0;
height:2px;
width:0;
background:linear-gradient(90deg,rgb(159, 161, 255),rgb(214, 217, 255));
z-index:999;
box-shadow:0 0 20px #fff;
}

.hero{
/* height:100vh; */
display:top;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
}

.hero h1{
font-family:"Cormorant Garamond",serif;
font-size:min(11vw,8rem);
font-weight:600;
text-shadow:0 0 20px rgb(58, 58, 152);
font-weight: bold;
}

.hero p{
margin-top:20px;
opacity:.75;
letter-spacing:.3em;
color: rgb(240, 224, 255);
/* negrita */
font-weight: bold;
}

.archive{
width:min(1400px,95vw);
margin:auto;
padding-bottom:200px;
}

.record{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
position:sticky;
top:0;
}

.card{
width:min(1000px,92vw);
height:min(650px,80vh);
background:rgb(58, 58, 152);
backdrop-filter:blur(30px);
border:1px solid rgb(58, 58, 152);
border-radius:32px;
overflow:hidden;
display:grid;
grid-template-columns:1.2fr 1fr;
box-shadow:
0 0 0 1px rgb(159, 161, 255),
0 30px 120px rgb(159, 161, 255);
}

.left{
padding:60px;
display:flex;
flex-direction:column;
justify-content:center;
}

.code{
color:var(--gold);
letter-spacing:.4em;
font-size:.8rem;
margin-bottom:20px;
}

.country{
font-family:"Cormorant Garamond",serif;
font-size:5rem;
line-height:.9;
}

.desc{
margin-top:25px;
opacity:.78;
line-height:1.9;
max-width:500px;
}

.enter{
margin-top:35px;
display:inline-block;
text-decoration:none;
background:var(--gold);
color:#111;
padding:14px 24px;
border-radius:999px;
font-weight:700;
align-self:flex-start;
}

.right{
border-left:1px solid var(--line);
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

.year{
font-size:min(18vw,10rem);
font-weight:700;
opacity:.08;
position:absolute;
}

.ring{
width:280px;
height:280px;
border-radius:50%;
border:1px solid rgba(216,186,120,.35);
position:absolute;
animation:spin 30s linear infinite;
}

.ring:nth-child(2){
width:360px;
height:360px;
animation-duration:42s;
animation-direction:reverse;
}

.dot{
width:10px;
height:10px;
background:rgb(159, 161, 255);
border-radius:50%;
position:absolute;
top:-5px;
left:50%;
transform:translateX(-50%);
box-shadow:0 0 20px rgb(159, 161, 255);
}

@keyframes spin{
from{transform:rotate(0)}
to{transform:rotate(360deg)}
}

.flag-container{
position:absolute;
width:190px;
height:190px;
border-radius:50%;
overflow:hidden;
background:rgb(174, 226, 255);
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
border:2px solid rgb(174, 226, 255);
box-shadow:0 0 60px rgb(174, 226, 255), inset 0 1px 10px rgb(174, 226, 255);
animation:flagSpin 28s linear infinite;
z-index:2;
}

.flag{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%;
}

.flag-container::before{
content:'';
position:absolute;
top:0;
left:-120%;
width:60%;
height:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);
transform:skewX(-20deg);
animation:shine 6s infinite;
}

@keyframes flagSpin{
from{transform:rotate(0deg)}
to{transform:rotate(360deg)}
}

@keyframes shine{
from{left:-120%}
to{left:180%}
}


.final{
height:100vh;
display:top;
justify-content:center;
align-items:center;
text-align:center;
}

.final h2{
font-family:"Cormorant Garamond",serif;
font-size:min(9vw,6rem);
}

.final p{
margin-top:20px;
opacity:.75;
}

@media(max-width:900px){
.card{
grid-template-columns:1fr;
height:min(90vh,650px);
}
.left{
padding:30px;
}
.right{
min-height:220px;
border-left:none;
border-top:1px solid var(--line);
}
.country{
font-size:3.5rem;
}
.ring{width:180px;height:180px}
.ring:nth-child(2){width:240px;height:240px}
.flag-container{width:130px;height:130px}
}
</style>
<script src="js/auth.js"></script>
</head>
<body>

<div id="bg"></div>
<div class="aurora a1"></div>
<div class="aurora a2"></div>
<div class="aurora a3"></div>

<canvas id="stars"></canvas>

<div class="progress" id="progress"></div>

<section class="hero">
<div>
<h1>El Archivo del Tiempo</h1>
<p>TODOS LOS MOMENTOS QUE MERECEN SER CONSERVADOS</p>
<p>¡Desliza para verlos!</p>
</div>
</section>

<div class="archive" id="archive"></div>

<section class="final">
<div>
<h2>Clasificación incompleta.</h2>
<p>Se siguen registrando nuevos recuerdos...</p>
</div>
</section>

<script src="js/countries.js"></script>
<script>

const archive=document.getElementById('archive');

COUNTRIES.forEach(function(c,i){
const el=document.createElement('section');
el.className='record';
const code="AR-"+String(i+1).padStart(3,"0");
const flagHtml=c.flag
  ?`<img class="flag" src="${c.flag}" alt="${c.name}">`
  :`<span style="font-size:4rem;display:flex;align-items:center;justify-content:center;height:100%;">${c.emoji}</span>`;

el.innerHTML=`
<div class="card">
<div class="left">
<div class="code">${code}</div>
<div class="country">${c.name}</div>
<div class="desc">${c.tagline}. Este recuerdo ha sido preservado dentro del archivo permanente de nuestra historia.</div>
<a href="${c.id}.html" class="enter">Abrir recuerdo</a>
</div>
<div class="right">
<div class="flag-container">${flagHtml}</div>
<div class="ring"><div class="dot"></div></div>
<div class="ring"><div class="dot"></div></div>
</div>
</div>`;

archive.appendChild(el);
});

addEventListener('scroll',()=>{
const max=document.documentElement.scrollHeight-innerHeight;
document.getElementById('progress').style.width=(scrollY/max*100)+'%';
});


const stars=document.getElementById("stars");
const sctx=stars.getContext("2d");

function resizeStars(){
stars.width=innerWidth;
stars.height=innerHeight;
}
resizeStars();
window.addEventListener('resize',resizeStars);

const particles=[];
for(let i=0;i<220;i++){
particles.push({
x:Math.random()*innerWidth,
y:Math.random()*innerHeight,
r:Math.random()*2,
v:Math.random()*0.3+0.05
});
}

let animating=true;

function animateStars(){
sctx.clearRect(0,0,stars.width,stars.height);

for(const p of particles){
p.y+=p.v;

if(p.y>innerHeight){
p.y=0;
}

const glow=sctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*6);
glow.addColorStop(0,'rgba(255,255,255,.95)');
glow.addColorStop(.35,'rgba(255,255,255,.25)');
glow.addColorStop(1,'rgba(255,255,255,0)');

sctx.fillStyle=glow;
sctx.beginPath();
sctx.arc(p.x,p.y,p.r*6,0,Math.PI*2);
sctx.fill();

sctx.fillStyle='rgba(255,255,255,.95)';
sctx.beginPath();
sctx.arc(p.x,p.y,p.r,0,Math.PI*2);
sctx.fill();
}

if(animating) requestAnimationFrame(animateStars);
}

document.addEventListener('visibilitychange',function(){
if(document.hidden){animating=false;}
else{animating=true;animateStars();}
});

animateStars();


</script>

</body>
</html>
