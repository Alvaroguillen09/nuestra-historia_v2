  canvas.width=W*dpr;
  canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  buildPaths();
  render();
}

function buildPaths(){
  builtPaths=[];
  GEO.forEach(function(c){
    if(!c.p||c.p.length<1)return;
    var path=new Path2D();
    /* Support multi-polygon: p is [[pt,pt,...],[pt,pt,...]] when p[0][0] is an array */
    var isMulti=Array.isArray(c.p[0][0]);
    var polys=isMulti?c.p:[c.p];
    polys.forEach(function(poly){
      if(poly.length<3)return;
      var p0=proj(poly[0][0],poly[0][1],W,H);
      path.moveTo(p0[0],p0[1]);
      for(var i=1;i<poly.length;i++){
        var pi=proj(poly[i][0],poly[i][1],W,H);
        path.lineTo(pi[0],pi[1]);
      }
      path.closePath();
    });
    builtPaths.push({
      id:c.id,path:path,v:c.v,
      name:c.name||'',emoji:c.emoji||'',
      bucketName:c.bucketName||c.name||''
    });
  });
}

function centroid(geoEntry){
  var sx=0,sy=0,n=0;
  var isMulti=Array.isArray(geoEntry.p[0][0]);
  var polys=isMulti?geoEntry.p:[geoEntry.p];
  polys.forEach(function(poly){
    poly.forEach(function(pt){
      var pp=proj(pt[0],pt[1],W,H);
      sx+=pp[0];sy+=pp[1];n++;
    });
  });
  return n>0?[sx/n,sy/n]:[0,0];
}

function clampPan(){
  if(zoom<=1){panX=0;panY=0;return;}
  panX=Math.min(0,Math.max(W*(1-zoom),panX));
  panY=Math.min(0,Math.max(H*(1-zoom),panY));
}

/* ── Render ────────────────────────────────────────────── */
function render(){
  if(!W||!H)return;
  var wl=getWL();

  /* Ocean & grid — drawn at base DPR transform, always fills full canvas */
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  var bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'rgb(10,8,42)');
  bg.addColorStop(1,'rgb(16,14,60)');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(100,120,220,0.05)';ctx.lineWidth=0.5;
  for(var gx=0;gx<W;gx+=W/12){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke();}
  for(var gy=0;gy<H;gy+=H/8){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}

  /* Switch to zoom+pan transform for all map geometry */
  ctx.setTransform(dpr*zoom,0,0,dpr*zoom,Math.round(panX*dpr),Math.round(panY*dpr));

  /* Pass 1 — non-visited, non-wishlisted (dark blue) */
  builtPaths.forEach(function(c){
    if(c.v)return;
    var inWL=wl.indexOf(c.bucketName)!==-1;
    if(inWL)return;
    var isHov=hovered===c.id;
    ctx.save();
    ctx.fillStyle=isHov?'rgba(55,65,140,.75)':'rgba(42,52,120,.55)';
    ctx.strokeStyle=isHov?'rgba(100,120,200,.7)':'rgba(70,85,160,.4)';
    ctx.lineWidth=(isHov?1.1:0.6)/zoom;
    ctx.fill(c.path);
    ctx.stroke(c.path);
    ctx.restore();
  });

  /* Pass 2 — wishlisted countries (gold) */
  builtPaths.forEach(function(c){
    if(c.v)return;
    var inWL=wl.indexOf(c.bucketName)!==-1;
    if(!inWL)return;
    var isHov=hovered===c.id;
    ctx.save();
    ctx.fillStyle=isHov?'rgba(240,190,60,.85)':'rgba(200,155,35,.75)';
    ctx.strokeStyle=isHov?'rgba(255,215,100,.95)':'rgba(255,210,80,.8)';
    ctx.lineWidth=(isHov?1.8:1.1)/zoom;
    if(isHov){ctx.shadowBlur=16/zoom;ctx.shadowColor='rgba(255,200,60,.7)';}
    ctx.fill(c.path);
    ctx.stroke(c.path);
    ctx.restore();
  });

  /* Visited */
  builtPaths.forEach(function(c){
    if(!c.v)return;
    var isHov=hovered===c.id;
    ctx.save();
    ctx.shadowBlur=(isHov?28:14)/zoom;
    ctx.shadowColor=isHov?'rgba(200,170,255,0.9)':'rgba(150,110,240,0.7)';
    ctx.fillStyle=isHov?'rgba(165,125,255,0.88)':'rgba(115,80,210,0.72)';
    ctx.fill(c.path);
    ctx.shadowBlur=0;
    ctx.strokeStyle=isHov?'rgba(220,205,255,1.0)':'rgba(180,155,255,0.8)';
    ctx.lineWidth=(isHov?1.8:1.0)/zoom;
    ctx.stroke(c.path);
    ctx.restore();
  });

  /* Vatican dot */
  var vp=proj(VATICAN.lon,VATICAN.lat,W,H);
  var vr=Math.max(5,W*0.008);
  var vHov=hovered==='vaticano';
  ctx.save();
  ctx.shadowBlur=(vHov?20:10)/zoom;ctx.shadowColor='rgba(200,170,255,0.9)';
  ctx.fillStyle=vHov?'rgba(220,200,255,0.95)':'rgba(180,155,255,0.85)';
  ctx.beginPath();ctx.arc(vp[0],vp[1],vr,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(240,230,255,0.9)';ctx.lineWidth=1/zoom;ctx.stroke();
  ctx.restore();

  /* Emoji labels — always visible, size clamped so they fit at any zoom */
  var fs=Math.max(8,Math.min(16,W*0.016))/zoom;
  builtPaths.forEach(function(c){
    if(!c.v||!c.emoji)return;
    var geo=GEO.find(function(g){return g.id===c.id;});
    if(!geo)return;
    var ctr=centroid(geo);
    ctx.font=fs+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.fillText(c.emoji,ctr[0],ctr[1]);
  });

  /* Wishlist flag emojis */
  builtPaths.forEach(function(c){
    if(c.v||!c.emoji)return;
    if(wl.indexOf(c.bucketName)===-1)return;
    var geo=GEO.find(function(g){return g.id===c.id;});
    if(!geo)return;
    var ctr=centroid(geo);
    ctx.font=fs+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(c.emoji,ctr[0],ctr[1]);
  });

  var vp2=proj(VATICAN.lon,VATICAN.lat,W,H);
  ctx.font=Math.max(6,W*0.012)/zoom+'px serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(VATICAN.emoji,vp2[0],vp2[1]);
}

/* ── Hit test ──────────────────────────────────────────── */
var tip=document.getElementById('mapTip');

function getHovered(cx,cy){
  /* Convert CSS mouse position to base map coordinates (undo zoom+pan) */
  var bx=(cx-panX)/zoom,by=(cy-panY)/zoom;
  var vp=proj(VATICAN.lon,VATICAN.lat,W,H);
  var vr=Math.max(6,W*0.012);
  var dx=bx-vp[0],dy=by-vp[1];
  if(dx*dx+dy*dy<=vr*vr)return'vaticano';
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  var found=null;
  for(var i=builtPaths.length-1;i>=0;i--){
    if(builtPaths[i].v&&ctx.isPointInPath(builtPaths[i].path,bx,by)){found=builtPaths[i].id;break;}
  }
  if(!found){
    for(var j=builtPaths.length-1;j>=0;j--){
      if(!builtPaths[j].v&&ctx.isPointInPath(builtPaths[j].path,bx,by)){found=builtPaths[j].id;break;}
    }
  }
  ctx.restore();
  return found;
}

function findBP(id){return builtPaths.find(function(c){return c.id===id;});}

function showTip(ex,ey,bp,isVat){
  var info;
  if(isVat){info={name:VATICAN.name,emoji:VATICAN.emoji,tagline:'El corazón de Italia',v:true};}
  else{
    var cnt=bp.v?COUNTRIES.find(function(c){return c.id===bp.id;}):null;
    info={name:bp.name,emoji:bp.emoji,tagline:cnt?cnt.tagline:'',v:bp.v};
  }
  var lock=info.v?'':'<div class="tip-lock">🔒 Pendiente</div>';
  tip.innerHTML='<strong>'+info.emoji+' '+info.name+'</strong>'+(info.tagline?'<small>'+info.tagline+'</small>':'')+lock;
  tip.style.opacity='1';
  var tx=ex+15,ty=ey-12;
  if(tx+240>innerWidth)tx=ex-245;
  if(ty<8)ty=ey+20;
  tip.style.left=tx+'px';tip.style.top=ty+'px';
}

function navigateTo(id,isVat){
  document.documentElement.style.transition='opacity 0.35s ease';
  document.documentElement.style.opacity='0';
  var target=isVat?'vaticano.html':id+'.html';
  setTimeout(function(){window.location.href=target;},380);
}

/* ── Mouse: drag-to-pan + hover ────────────────────────── */
var dragAnchor=null,dragMoved=false;

canvas.addEventListener('mousedown',function(e){
  dragAnchor={x:e.clientX,y:e.clientY,px:panX,py:panY};
  dragMoved=false;
});

window.addEventListener('mouseup',function(){
  if(dragAnchor&&dragMoved){canvas.style.cursor=hovered?'pointer':'default';}
  dragAnchor=null;dragMoved=false;
});

canvas.addEventListener('mousemove',function(e){
  if(dragAnchor&&zoom>1){
    var dx=e.clientX-dragAnchor.x,dy=e.clientY-dragAnchor.y;
    if(Math.abs(dx)>3||Math.abs(dy)>3){
      dragMoved=true;
      panX=dragAnchor.px+dx;panY=dragAnchor.py+dy;
      clampPan();canvas.style.cursor='grabbing';
      tip.style.opacity='0';render();return;
    }
  }
  var r=canvas.getBoundingClientRect();
  var cx=e.clientX-r.left,cy=e.clientY-r.top;
  var h=getHovered(cx,cy);
  if(h!==hovered){hovered=h;canvas.style.cursor=h?'pointer':'default';render();}
  if(h){var isVat=h==='vaticano';var bp=isVat?{v:true}:findBP(h);if(bp)showTip(e.clientX,e.clientY,bp,isVat);}
  else{tip.style.opacity='0';}
});

canvas.addEventListener('mouseleave',function(){
  hovered=null;tip.style.opacity='0';canvas.style.cursor='default';render();
});

canvas.addEventListener('click',function(){
  if(dragMoved)return;
  if(!hovered)return;
  var isVat=hovered==='vaticano';
  var bp=isVat?{v:true}:findBP(hovered);
  if(!bp||!bp.v)return;
  navigateTo(hovered,isVat);
});

/* ── Mouse wheel zoom ──────────────────────────────────── */
canvas.addEventListener('wheel',function(e){
  e.preventDefault();
  var r=canvas.getBoundingClientRect();
  var mx=e.clientX-r.left,my=e.clientY-r.top;
  var factor=e.deltaY>0?0.85:1.18;
  var nz=Math.max(1,Math.min(8,zoom*factor));
  if(nz!==zoom){
    panX=mx-(mx-panX)*(nz/zoom);
    panY=my-(my-panY)*(nz/zoom);
    zoom=nz;clampPan();render();
  }
},{passive:false});

/* ── Touch: pinch-zoom + pan + tap ────────────────────── */
var touchTimer=null,pinchPrev=null,tapAnchor=null,lastTap=0;

function tDist(t){var dx=t[1].clientX-t[0].clientX,dy=t[1].clientY-t[0].clientY;return Math.sqrt(dx*dx+dy*dy);}
function tMid(t,r){return{x:(t[0].clientX+t[1].clientX)/2-r.left,y:(t[0].clientY+t[1].clientY)/2-r.top};}

canvas.addEventListener('touchstart',function(e){
  e.preventDefault();
  if(e.touches.length===2){
    var r=canvas.getBoundingClientRect();
    var m=tMid(e.touches,r);
    pinchPrev={dist:tDist(e.touches),mx:m.x,my:m.y};
    tapAnchor=null;tip.style.opacity='0';return;
  }
  pinchPrev=null;
  var now=Date.now(),t=e.touches[0];
  var r=canvas.getBoundingClientRect();
  var cx=t.clientX-r.left,cy=t.clientY-r.top;
  if(now-lastTap<280&&zoom>1){zoom=1;panX=0;panY=0;render();lastTap=0;return;}
  lastTap=now;
  tapAnchor={x:t.clientX,y:t.clientY,px:panX,py:panY,cx:cx,cy:cy,moved:false};
  var h=getHovered(cx,cy);
  if(h&&h!==hovered){hovered=h;render();}
},{passive:false});

canvas.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(e.touches.length===2&&pinchPrev){
    var r=canvas.getBoundingClientRect();
    var dist=tDist(e.touches),m=tMid(e.touches,r);
    var scale=dist/pinchPrev.dist,nz=Math.max(1,Math.min(8,zoom*scale));
    panX=m.x-(m.x-panX)*(nz/zoom)+(m.x-pinchPrev.mx);
    panY=m.y-(m.y-panY)*(nz/zoom)+(m.y-pinchPrev.my);
    zoom=nz;clampPan();
    pinchPrev={dist:dist,mx:m.x,my:m.y};
    tip.style.opacity='0';render();return;
  }
  if(e.touches.length===1&&tapAnchor){
    var t=e.touches[0];
    var dx=t.clientX-tapAnchor.x,dy=t.clientY-tapAnchor.y;
    if(Math.abs(dx)>4||Math.abs(dy)>4){
      tapAnchor.moved=true;
      if(zoom>1){panX=tapAnchor.px+dx;panY=tapAnchor.py+dy;clampPan();tip.style.opacity='0';render();}
    }
  }
},{passive:false});

canvas.addEventListener('touchend',function(e){
  if(e.touches.length<2)pinchPrev=null;
  if(e.touches.length===0&&tapAnchor&&!tapAnchor.moved){
    var cx=tapAnchor.cx,cy=tapAnchor.cy;
    var h=getHovered(cx,cy);
    if(h){
      var isVat=h==='vaticano';
      var bp=isVat?{v:true,name:'Vaticano',emoji:'🇻🇦'}:findBP(h);
      if(bp){
        if(bp.v){navigateTo(h,isVat);}
        else{
          hovered=h;render();
          var ct=e.changedTouches[0];
          showTip(ct.clientX,ct.clientY,bp,false);
          if(touchTimer)clearTimeout(touchTimer);
          touchTimer=setTimeout(function(){tip.style.opacity='0';hovered=null;render();},1800);
        }
      }
    }else{hovered=null;tip.style.opacity='0';render();}
    tapAnchor=null;
  }
},{passive:false});

/* ── International tags ────────────────────────────────── */
function buildIntlTags(){
  var wl=getWL();
  var el=document.getElementById('intlTags');
  el.innerHTML='';
  INTL_DEST.forEach(function(name){
    var tag=document.createElement('span');
    var inWL=wl.indexOf(name)!==-1;
    tag.className='intl-tag'+(inWL?' wl':'');
    tag.innerHTML=(inWL?'<span>★</span> ':'')+name;
    el.appendChild(tag);
  });
}

/* ── Map PNG download ──────────────────────────────────── */
function downloadMap(){
  /* Reset to full-map view for the export */
  var prevZoom=zoom,prevPanX=panX,prevPanY=panY;
  if(zoom!==1){zoom=1;panX=0;panY=0;render();}

  var wl=getWL();
  var mapW=W,mapH=H;
  var titleH=55,legendH=52,intlTitleH=22,pillH=22,pillPadX=10,gap=6,sidePad=18;

  /* Pre-measure intl pill layout using main ctx */
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.font='300 11px "Jost",sans-serif';
  var intlLayouts=computePillLayouts(ctx,0);
  ctx.restore();
  var intlContentH=intlLayouts.length>0
    ?(intlLayouts[intlLayouts.length-1].y+pillH+gap):0;
  var intlTotalH=intlContentH>0?(intlTitleH+intlContentH+16):0;
  var totalH=titleH+mapH+legendH+intlTotalH+20;

  /* Offscreen canvas at DPR resolution */
  var oc=document.createElement('canvas');
  oc.width=mapW*dpr;oc.height=totalH*dpr;
  var g=oc.getContext('2d');
  g.scale(dpr,dpr);

  /* Background */
  var bg=g.createLinearGradient(0,0,mapW,totalH);
  bg.addColorStop(0,'rgb(10,8,42)');bg.addColorStop(1,'rgb(16,14,60)');
  g.fillStyle=bg;g.fillRect(0,0,mapW,totalH);

  /* Title */
  g.font='300 20px "Cormorant Garamond",Georgia,serif';
  g.fillStyle='rgba(240,224,255,.85)';
  g.textAlign='center';g.textBaseline='middle';
  g.fillText('A & G · Nuestro Mapa',mapW/2,titleH/2);

  /* Map image */
  g.drawImage(canvas,0,titleH,mapW,mapH);

  /* Legend */
  var legItems=[
    {fill:'rgba(130,90,220,.8)',stroke:'rgba(180,160,255,.7)',label:'Visitados'},
    {fill:'rgba(200,155,35,.75)',stroke:'rgba(255,210,80,.8)',label:'Wishlist'},
    {fill:'rgba(42,52,120,.55)',stroke:'rgba(70,85,160,.4)',label:'Pendientes'}
  ];
  g.font='300 11px "Jost",sans-serif';g.textBaseline='middle';g.textAlign='left';
  var swW=16,swH=10,iGap=6,bGap=22;
  var totLegW=legItems.reduce(function(a,it){return a+swW+iGap+g.measureText(it.label).width+bGap;},0)-bGap;
  var lx=(mapW-totLegW)/2,lmy=titleH+mapH+legendH/2;
  legItems.forEach(function(it){
    g.fillStyle=it.fill;g.fillRect(lx,lmy-swH/2,swW,swH);
    g.strokeStyle=it.stroke;g.lineWidth=.8;
    g.beginPath();g.rect(lx,lmy-swH/2,swW,swH);g.stroke();
    g.fillStyle='rgba(214,217,255,.55)';
    g.fillText(it.label,lx+swW+iGap,lmy);
    lx+=swW+iGap+g.measureText(it.label).width+bGap;
  });

  /* International section */
  if(intlTotalH>0){
    var iy0=titleH+mapH+legendH;
    g.font='300 10px "Jost",sans-serif';g.fillStyle='rgba(240,224,255,.3)';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText('Más allá de Europa',mapW/2,iy0+intlTitleH/2);

    g.font='300 11px "Jost",sans-serif';
    var finalLayouts=computePillLayouts(g,iy0+intlTitleH);
    finalLayouts.forEach(function(l){
      var r=pillH/2,x=l.x,y=l.y,w=l.w;
      g.beginPath();
      g.moveTo(x+r,y);g.lineTo(x+w-r,y);
      g.arcTo(x+w,y,x+w,y+pillH,r);g.lineTo(x+w,y+pillH-r);
      g.arcTo(x+w,y+pillH,x+w-r,y+pillH,r);g.lineTo(x+r,y+pillH);
      g.arcTo(x,y+pillH,x,y+pillH-r,r);g.lineTo(x,y+r);
      g.arcTo(x,y,x+r,y,r);g.closePath();
      g.fillStyle=l.inWL?'rgba(60,45,10,.4)':'rgba(30,25,80,.4)';
      g.strokeStyle=l.inWL?'rgba(255,215,100,.4)':'rgba(214,217,255,.15)';
      g.lineWidth=.5;g.fill();g.stroke();
      g.fillStyle=l.inWL?'rgba(255,215,100,.85)':'rgba(214,217,255,.5)';
      g.textAlign='left';g.textBaseline='middle';
      g.fillText(l.label,x+pillPadX,y+pillH/2);
    });
  }

  /* Download */
  oc.toBlob(function(blob){
    if(!blob)return;
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='nuestro-mapa.png';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},2000);
    restoreZoom();
  },'image/png');

  function computePillLayouts(ctx2,y0){
    var x=sidePad,y=y0;
    return INTL_DEST.map(function(name){
      var inWL=wl.indexOf(name)!==-1;
      var label=(inWL?'★ ':'')+name;
      var tw=ctx2.measureText(label).width;
      var pw=tw+pillPadX*2;
      if(x+pw>mapW-sidePad){x=sidePad;y+=pillH+gap;}
      var layout={x:x,y:y,w:pw,label:label,inWL:inWL};
      x+=pw+gap;return layout;
    });
  }

  function restoreZoom(){
    if(prevZoom!==1){zoom=prevZoom;panX=prevPanX;panY=prevPanY;render();}
  }
}

/* ── Init & refresh triggers ───────────────────────────── */
function fullRefresh(){
  if(W>0){render();buildIntlTags();}
}

window.addEventListener('resize',function(){resize();});
window.addEventListener('load',function(){resize();buildIntlTags();});
/* Re-render when navigating back via browser back/forward */
window.addEventListener('pageshow',function(){setTimeout(function(){resize();buildIntlTags();},50);});
/* Re-render when tab becomes visible again */
document.addEventListener('visibilitychange',function(){if(!document.hidden)fullRefresh();});
/* Re-render when window regains focus (switching from bucket-list tab) */
window.addEventListener('focus',function(){fullRefresh();});
/* Re-render immediately when wishlist changes in another tab */
window.addEventListener('storage',function(e){if(e.key===WL_KEY)fullRefresh();});

resize();
buildIntlTags();
syncWLFromFirestore(function() { fullRefresh(); });
document.getElementById('dlBtn').addEventListener('click',downloadMap);
</script>
