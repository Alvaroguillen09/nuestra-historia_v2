<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; script-src 'self' 'unsafe-inline';">
<title>Álvaro & Gabriela — Citas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Great+Vibes&family=Jost:wght@200;300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:rgb(8,6,30);color:#fff;overflow:hidden;font-family:'Jost',sans-serif}
.bg-grad{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 40%,rgba(80,50,160,.28) 0%,transparent 60%),radial-gradient(ellipse at 75% 70%,rgba(120,60,200,.18) 0%,transparent 55%);pointer-events:none;z-index:0}
.page{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
/* Top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:1.2rem 2rem;position:absolute;top:0;left:0;right:0;z-index:10}
.topbar__logo{font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:rgba(240,224,255,.75);text-decoration:none}
.topbar__back{font-size:.63rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(214,217,255,.6);text-decoration:none;padding:.42rem .88rem;border-radius:999px;border:1px solid rgba(214,217,255,.18);transition:background .2s,color .2s}
.topbar__back:hover{background:rgba(214,217,255,.1);color:#fff}
/* Main quote area */
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:4rem 2rem 6rem;position:relative}
.quote-wrap{text-align:center;max-width:680px;width:100%;transition:opacity .55s ease,transform .55s ease}
.quote-wrap.fade-out{opacity:0;transform:translateY(12px) scale(.98)}
.quote-mark{font-family:'Great Vibes',cursive;font-size:clamp(5rem,12vw,8rem);color:rgba(140,110,255,.2);line-height:.6;display:block;margin-bottom:-1rem}
.quote-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.4rem,4vw,2.2rem);font-weight:300;color:rgba(240,224,255,.95);line-height:1.7;letter-spacing:.02em;text-shadow:0 2px 30px rgba(80,50,160,.3)}
.quote-mark-close{font-family:'Great Vibes',cursive;font-size:clamp(5rem,12vw,8rem);color:rgba(140,110,255,.2);line-height:.4;display:block;margin-top:-.5rem}
.quote-attr{margin-top:2rem;display:flex;align-items:center;justify-content:center;gap:.65rem}
.quote-emoji{font-size:1.6rem}
.quote-country{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:400;color:rgba(214,217,255,.65);letter-spacing:.05em}
.quote-tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.88rem;color:rgba(190,170,255,.4);margin-top:.2rem}
/* Controls */
.controls{position:absolute;bottom:2rem;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:1rem;z-index:10}
.dots{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;max-width:80vw}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(214,217,255,.2);cursor:pointer;transition:background .25s,transform .25s;border:none;padding:0}
.dot.on{background:rgba(214,217,255,.75);transform:scale(1.3)}
.dot:hover{background:rgba(214,217,255,.5)}
.nav-btns{display:flex;align-items:center;gap:.75rem}
.nbtn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(214,217,255,.18);background:rgba(30,20,80,.45);color:rgba(214,217,255,.7);font-size:1.1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.nbtn:hover{background:rgba(80,60,180,.45);border-color:rgba(214,217,255,.4);color:#fff}
.pause-btn{width:36px;height:36px;font-size:.85rem;border-radius:50%;border:1px solid rgba(214,217,255,.15);background:rgba(30,20,80,.35);color:rgba(214,217,255,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.pause-btn:hover{background:rgba(80,60,180,.38);color:#fff}
/* Progress bar */
.pgbar{position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(214,217,255,.08)}
.pgfill{height:100%;background:linear-gradient(to right,rgba(140,110,255,.5),rgba(210,190,255,.9));transform-origin:left;transform:scaleX(0)}
.pgfill.run{animation:pg var(--dur,5s) linear forwards}
@keyframes pg{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
<script src="js/auth.js"></script>
</head>
<body>
<div class="bg-grad"></div>
<div class="page">
  <div class="topbar">
    <a class="topbar__logo" href="el_archivo_del_tiempo_aurora_estrellas_atlas_banderas.html">A &amp; G</a>
    <a class="topbar__back" href="el_archivo_del_tiempo_aurora_estrellas_atlas_banderas.html">← Volver</a>
  </div>
  <div class="stage">
    <div class="quote-wrap" id="qwrap">
      <span class="quote-mark">"</span>
      <p class="quote-text" id="qtext"></p>
      <span class="quote-mark-close">"</span>
      <div class="quote-attr">
        <span class="quote-emoji" id="qemoji"></span>
        <div>
          <div class="quote-country" id="qcountry"></div>
          <div class="quote-tagline" id="qtagline"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="controls">
    <div class="dots" id="dots"></div>
    <div class="nav-btns">
      <button class="nbtn" id="prev">‹</button>
      <button class="pause-btn" id="pause">⏸</button>
      <button class="nbtn" id="next">›</button>
    </div>
  </div>
  <div class="pgbar"><div class="pgfill" id="pgfill"></div></div>
</div>

<script src="js/countries.js"></script>
<script src="js/transitions.js"></script>
<script src="js/music.js"></script>
<script>
(function(){
  var DUR=5500;
  var quotes=COUNTRIES.map(function(c){return{quote:c.quote,name:c.name,emoji:c.emoji,tagline:c.tagline};});
  var idx=0, playing=true, timer=null;
  var qwrap=document.getElementById('qwrap'),qtext=document.getElementById('qtext'),qemoji=document.getElementById('qemoji'),qcountry=document.getElementById('qcountry'),qtagline=document.getElementById('qtagline');
  var pgfill=document.getElementById('pgfill'),pauseBtn=document.getElementById('pause');

  // Build dots
  var dotsEl=document.getElementById('dots');
  quotes.forEach(function(_,i){
    var d=document.createElement('button');
    d.className='dot'+(i===0?' on':'');
    d.setAttribute('aria-label','Cita '+(i+1));
    d.addEventListener('click',function(){manual(i);});
    dotsEl.appendChild(d);
  });

  function setDots(i){dotsEl.querySelectorAll('.dot').forEach(function(d,j){d.classList.toggle('on',j===i);});}

  function show(i,animate){
    var q=quotes[i];
    if(animate!==false){
      qwrap.classList.add('fade-out');
      setTimeout(function(){
        qtext.textContent=q.quote;
        qemoji.textContent=q.emoji;
        qcountry.textContent=q.name;
        qtagline.textContent=q.tagline;
        qwrap.classList.remove('fade-out');
      },420);
    } else {
      qtext.textContent=q.quote;
      qemoji.textContent=q.emoji;
      qcountry.textContent=q.name;
      qtagline.textContent=q.tagline;
    }
    setDots(i);
    idx=i;
    restartBar();
  }

  function restartBar(){
    pgfill.className='pgfill';
    pgfill.style.setProperty('--dur',(DUR/1000)+'s');
    void pgfill.offsetWidth;
    if(playing) pgfill.className='pgfill run';
  }

  function tick(){
    if(timer) clearTimeout(timer);
    timer=setTimeout(function(){
      show((idx+1)%quotes.length);
      if(playing) tick();
    },DUR);
  }

  function manual(i){
    if(timer){clearTimeout(timer);timer=null;}
    show(i);
    if(playing) tick();
  }

  function togglePlay(){
    if(playing){
      playing=false; pauseBtn.textContent='▶';
      if(timer){clearTimeout(timer);timer=null;}
      pgfill.className='pgfill';
    } else {
      playing=true; pauseBtn.textContent='⏸';
      restartBar(); tick();
    }
  }

  document.getElementById('prev').addEventListener('click',function(){manual((idx-1+quotes.length)%quotes.length);});
  document.getElementById('next').addEventListener('click',function(){manual((idx+1)%quotes.length);});
  document.getElementById('pause').addEventListener('click',togglePlay);

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft') manual((idx-1+quotes.length)%quotes.length);
    if(e.key==='ArrowRight') manual((idx+1)%quotes.length);
    if(e.key===' '){e.preventDefault();togglePlay();}
  });

  var tx=0;
  document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
  document.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)manual(dx<0?(idx+1)%quotes.length:(idx-1+quotes.length)%quotes.length);},{passive:true});

  show(0,false);
  tick();
})();
</script>
</body>
</html>
