<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; script-src 'self' 'unsafe-inline';">
<title>Álvaro & Gabriela — Bucket List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Great+Vibes&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Jost',sans-serif;background:rgb(159,161,255);color:#fff;min-height:100vh;overflow-x:hidden}

.aurora{position:fixed;width:800px;height:800px;border-radius:50%;filter:blur(120px);opacity:.4;animation:float 18s infinite alternate ease-in-out;z-index:0}
.a1{background:#c78cff;left:-200px;top:-200px}
.a2{background:#8e7bff;right:-200px;top:15%;animation-duration:24s}
.a3{background:#ff9ee8;left:25%;bottom:-250px;animation-duration:20s}
@keyframes float{from{transform:translate(0,0) scale(1)}to{transform:translate(80px,-60px) scale(1.2)}}

.page{position:relative;z-index:1;min-height:100vh}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid rgba(214,217,255,.15)}
.hdr__logo{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:rgb(240,224,255);text-decoration:none}
.hdr__back{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(214,217,255,.75);text-decoration:none;padding:.5rem 1rem;border-radius:999px;border:1px solid rgba(214,217,255,.25);transition:background .2s,color .2s}
.hdr__back:hover{background:rgba(214,217,255,.12);color:rgba(240,224,255,1)}

/* Hero */
.hero{text-align:center;padding:3rem 1rem 2rem}
.hero__script{font-family:'Great Vibes',cursive;font-size:clamp(3rem,8vw,5rem);color:rgb(240,224,255);line-height:1;text-shadow:0 2px 30px rgba(58,58,152,.6)}
.hero__sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1rem,2.5vw,1.3rem);color:rgba(214,217,255,.75);margin-top:.6rem}
.hero__note{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(214,217,255,.45);margin-top:.8rem}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:1.25rem;
  max-width:1100px;margin:2.5rem auto;
  padding:0 1.5rem 5rem;
}

/* Cards */
.card{
  position:relative;
  border-radius:20px;
  padding:2rem 1.5rem;
  text-align:center;
  border:1px solid rgba(214,217,255,.15);
  background:rgba(40,40,110,.45);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  overflow:hidden;
  transition:transform .3s ease, box-shadow .3s ease;
  cursor:default;
  user-select:none;
}
.card:hover{transform:translateY(-5px);box-shadow:0 20px 50px rgba(20,20,80,.5)}

/* Lock overlay */
.card__lock{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(15,15,50,.55);
  backdrop-filter:blur(6px);
  border-radius:20px;
  font-size:2rem;
  transition:opacity .3s;
  z-index:5;
}
.card__lock span{display:block;font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(214,217,255,.55);margin-top:.5rem}
.card:hover .card__lock{opacity:0}

/* Card content */
.card__emoji{font-size:3.5rem;line-height:1;display:block;margin-bottom:.9rem;filter:blur(3px);transition:filter .3s}
.card:hover .card__emoji{filter:blur(0)}
.card__name{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:300;color:rgb(240,224,255)}
.card__tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.95rem;color:rgba(214,217,255,.6);margin-top:.4rem}
.card__dream{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(214,217,255,.4);margin-top:1.2rem}

/* Shimmer */
.card::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,transparent 60%);
  pointer-events:none;border-radius:20px;
}

/* Footer */
.footer{text-align:center;padding:2rem 1rem 4rem;border-top:1px solid rgba(214,217,255,.1)}
.footer p{font-family:'Cormorant Garamond',serif;font-style:italic;color:rgba(214,217,255,.5);font-size:.95rem}

@media(max-width:500px){.grid{grid-template-columns:1fr 1fr;gap:.75rem;padding:0 .75rem 4rem}.card{padding:1.5rem 1rem}}
</style>
<script src="js/auth.js"></script>
</head>
<body>
<div class="aurora a1"></div>
<div class="aurora a2"></div>
<div class="aurora a3"></div>

<div class="page">
  <header class="hdr">
    <a class="hdr__logo" href="el_archivo_del_tiempo_aurora_estrellas_atlas_banderas.html">A &amp; G</a>
    <a class="hdr__back" href="el_archivo_del_tiempo_aurora_estrellas_atlas_banderas.html">← Volver</a>
  </header>

  <div class="hero">
    <p class="hero__script">Sueños pendientes</p>
    <p class="hero__sub">Los destinos que aún nos esperan</p>
    <p class="hero__note">Pasa el ratón para soñar</p>
  </div>

  <div class="grid" id="grid"></div>

  <footer class="footer">
    <p>El mapa sigue creciendo. Lo mejor está por venir. ♡</p>
  </footer>
</div>

<script src="js/transitions.js"></script>
<script src="js/music.js"></script>
<script src="js/confetti.js"></script>
<script src="js/special-mode.js"></script>
<script>
var BUCKET = [
  { emoji:'🇵🇹', name:'Portugal',     tagline:'Fado y océano', dream:'Lisboa nos llama' },
  { emoji:'🇬🇷', name:'Grecia',        tagline:'Islas y azul infinito', dream:'Santorini al atardecer' },
  { emoji:'🇭🇷', name:'Croacia',       tagline:'Muros de Dubrovnik', dream:'Juego de tronos real' },
  { emoji:'🇳🇱', name:'Países Bajos',  tagline:'Tulipanes y canales', dream:'Amsterdam en bicicleta' },
  { emoji:'🇳🇴', name:'Noruega',       tagline:'Fiordos eternos', dream:'Aurora boreal juntos' },
  { emoji:'🇨🇭', name:'Suiza',         tagline:'Alpes y chocolate', dream:'Tren entre montañas' },
  { emoji:'🇮🇸', name:'Islandia',      tagline:'Auroras boreales', dream:'Bajo las luces del norte' },
  { emoji:'🇯🇵', name:'Japón',         tagline:'Cerezos en flor', dream:'Tokio nos espera' },
  { emoji:'🇲🇦', name:'Marruecos',     tagline:'Especias y medinas', dream:'El desierto del Sáhara' },
  { emoji:'🇸🇪', name:'Suecia',        tagline:'Norte mágico', dream:'Laponia en invierno' },
  { emoji:'🇧🇪', name:'Bélgica',       tagline:'Chocolate y cervezas', dream:'Brujas al anochecer' },
  { emoji:'🇵🇱', name:'Polonia',       tagline:'Historia y resiliencia', dream:'Cracovia en navidad' }
];

var grid = document.getElementById('grid');
BUCKET.forEach(function(d){
  var card = document.createElement('div');
  card.className = 'card';
  card.innerHTML =
    '<div class="card__lock">🔒<span>Próximamente</span></div>' +
    '<span class="card__emoji">' + d.emoji + '</span>' +
    '<div class="card__name">' + d.name + '</div>' +
    '<div class="card__tagline">' + d.tagline + '</div>' +
    '<div class="card__dream">' + d.dream + '</div>';
  grid.appendChild(card);
});
</script>
</body>
</html>
