<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; script-src 'self';">
<title>Álvaro &amp; Gabriela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Great+Vibes&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Jost',sans-serif;
  background:rgb(159,161,255);
  color:#fff;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

#bg{position:fixed;inset:0;z-index:-3;background:rgb(159,161,255)}

.aurora{
  position:fixed;
  width:800px;height:800px;
  border-radius:50%;
  filter:blur(120px);
  opacity:.45;
  animation:float 18s infinite alternate ease-in-out;
  z-index:-2;
}
.a1{background:#c78cff;left:-200px;top:-200px}
.a2{background:#8e7bff;right:-200px;top:20%;animation-duration:24s}
.a3{background:#ff9ee8;left:30%;bottom:-250px;animation-duration:20s}

@keyframes float{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(80px,-60px) scale(1.2)}
}

#stars{position:fixed;inset:0;z-index:-1;pointer-events:none}

.card{
  position:relative;
  z-index:1;
  background:rgba(58,58,152,.55);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  border:1px solid rgba(214,217,255,.2);
  border-radius:28px;
  padding:50px 44px;
  width:min(420px,92vw);
  text-align:center;
  box-shadow:0 0 0 1px rgba(159,161,255,.3), 0 30px 80px rgba(58,58,152,.4);
}

.lock{font-size:2rem;margin-bottom:18px;display:block}

.logo{
  font-family:'Great Vibes',cursive;
  font-size:3.2rem;
  color:rgb(240,224,255);
  text-shadow:0 2px 20px rgba(58,58,152,.6);
  margin-bottom:6px;
}

.subtitle{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:1rem;
  color:rgb(214,217,255);
  opacity:.8;
  letter-spacing:.08em;
  margin-bottom:32px;
}

.input-wrap{position:relative;margin-bottom:10px}

input[type="password"],input[type="text"]{
  width:100%;
  padding:14px 46px 14px 18px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(214,217,255,.3);
  border-radius:12px;
  color:#fff;
  font-family:'Jost',sans-serif;
  font-size:1.1rem;
  letter-spacing:.25em;
  outline:none;
  transition:border-color .25s;
}

input::placeholder{color:rgba(255,255,255,.4);letter-spacing:.05em;font-size:.9rem}
input:focus{border-color:rgba(214,217,255,.7)}

.toggle-vis{
  position:absolute;right:13px;top:50%;
  transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  color:rgba(255,255,255,.5);font-size:1rem;
  padding:4px;transition:color .2s;line-height:1;
}
.toggle-vis:hover{color:rgba(255,255,255,.9)}

.error{
  color:rgb(255,180,180);
  font-size:.82rem;
  margin-bottom:14px;
  letter-spacing:.04em;
}

.btn{
  width:100%;
  padding:14px;
  background:rgb(214,217,255);
  color:#1a1a6e;
  border:none;
  border-radius:999px;
  font-family:'Jost',sans-serif;
  font-weight:600;
  font-size:.85rem;
  letter-spacing:.22em;
  text-transform:uppercase;
  cursor:pointer;
  transition:opacity .2s,transform .15s;
  margin-top:4px;
}
.btn:hover{opacity:.9;transform:scale(1.02)}
.btn:active{transform:scale(.98)}
</style>
</head>
<body>
<div id="bg"></div>
<div class="aurora a1"></div>
<div class="aurora a2"></div>
<div class="aurora a3"></div>
<canvas id="stars"></canvas>

<div class="card">
  <span class="lock">🔒</span>
  <div class="logo">A &amp; G</div>
  <p class="subtitle">Introduce la contraseña para continuar</p>

  <form id="passForm" autocomplete="off">
    <div class="input-wrap">
      <input id="passInput" type="password" placeholder="Contraseña" autocomplete="current-password" autofocus>
      <button type="button" class="toggle-vis" id="toggleVis" aria-label="Mostrar contraseña">👁</button>
    </div>
    <p class="error" id="passError" hidden>Contraseña incorrecta, inténtalo de nuevo</p>
    <button type="submit" class="btn">Entrar</button>
  </form>
</div>

<script src="js/confetti.js"></script>
<script src="js/transitions.js"></script>
<script src="js/password.js"></script>
</body>
</html>
