<style>

.btn-viaje{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-weight: bold;
    width:290px;
    height:54px;

    border:1.5px solid rgb(107, 107, 230);
    border-radius:999px;
    /* background:transparent; */
    background:rgb(240, 224, 255);
    color:rgb(107, 107, 230);

    font-family:'Jost',sans-serif;
    font-weight:300;
    font-size:15px;

.a{
  font-weight: bold;

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#fdf8f2;--parchment:#f5ede0;--dusty-rose:#d4a5a5;--blush:#e8c5c5;
  --wine:#7a3b3b;--ink:#2b2020;--soft-ink:#4a3535;--muted:#8a7070;
  --gold:#c9a96e;--gold-light:#e8d5b0;
  --ff-display:'Cormorant Garamond',Georgia,serif;
  --ff-script:'Great Vibes',cursive;
  --ff-body:'Jost',sans-serif;
  --header-h:64px;
  --ease:cubic-bezier(.4,0,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
html{scroll-behavior:smooth}
body{font-family:var(--ff-body);background:var(--cream);color:var(--ink);overflow-x:hidden;transition:background-color .7s var(--ease)}
img{display:block;max-width:100%}
button{cursor:pointer;border:none;background:none;font:inherit}
.no-scroll{overflow:hidden}
::selection{background:var(--blush);color:var(--wine)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--blush);border-radius:10px}



/* ────────────────────────────────────────
   PORTADA
──────────────────────────────────────── */
.cover{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  /* background:linear-gradient(160deg,#2b1a1a 0%,#4a2a2a 45%,#7a4545 75%,#a06060 100%); */
  /* background-color: rgb(159, 161, 255); */
  overflow:hidden;
  transition:opacity .85s var(--ease),transform .85s var(--ease);
}
/* pétalos detrás de todo */
/* .cover__petals{position:absolute;inset:0;pointer-events:none;z-index:0} */
/* resplandor decorativo — pointer-events:none obligatorio */
.cover__glow{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 55%,rgba(201,169,110,.2) 0%,transparent 65%);
}
/* contenido encima de todo */
.cover__content{
  position:relative;z-index:2;
  text-align:center;padding:2rem;
  animation:fadeUp 1.1s .25s both;
}
.cover--exit{opacity:0;transform:scale(1.03);pointer-events:none}

@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

.cover__sub{font-family:var(--ff-body);font-weight:200;font-size:clamp(.8rem,1.8vw,.95rem);letter-spacing:.28em;text-transform:uppercase;font-weight: bold;color:rgb(81, 81, 205);margin-bottom:.6rem}
.cover__title{font-family:var(--ff-script);font-size:clamp(4.5rem,13vw,9.5rem);color:rgb(240, 224, 255);font-weight: bold;line-height:1;text-shadow:0 2px 40px rgb(58, 58, 152);margin-bottom:.15em}
.cover__from{font-family:var(--ff-display);font-style:italic;font-size:clamp(.95rem,2.2vw,1.3rem);font-weight: bold;color:rgb(214, 217, 255);margin-bottom:1.6rem}
.cover__tagline{font-family:var(--ff-display);font-size:clamp(.9rem,1.8vw,1.1rem);font-weight:300;font-weight: bold;color:rgb(214, 217, 255);line-height:1.9;margin-bottom:2.8rem}

.aurora{
position:fixed;
width:900px;
height:900px;
border-radius:50%;
filter:blur(120px);
opacity:.45;
animation:float 18s infinite alternate ease-in-out;
z-index:-2;
}

.a1{
background:#c78cff;
left:-250px;
top:-250px;
}

.a2{
background:#8e7bff;
right:-250px;
top:20%;
animation-duration:24s;
}

.a3{
background:#ff9ee8;
left:30%;
bottom:-300px;
animation-duration:20s;
}
/* ────────────────────────────────────────
   MOBILE NAV
──────────────────────────────────────── */
@media(max-width:767px){
  :root{--header-h:56px}
  .hdr{padding:0 1rem}
  .tabs-toggle{display:flex;margin-left:auto}
  .tabs-list{
    display:none;position:absolute;
    top:calc(var(--header-h) - 6px);left:50%;
    transform:translateX(-50%);
    width:min(90vw,340px);flex-direction:column;
    background:rgba(253,248,242,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--blush);border-radius:12px;
    box-shadow:0 8px 36px rgba(0,0,0,.11);
    padding:.45rem;max-height:68vh;overflow-y:auto;z-index:60;
  }
  .tabs-list--open{display:flex;animation:drop .28s var(--spring) both}
  @keyframes drop{from{opacity:0;transform:translateX(-50%) translateY(-8px) scale(.97)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
  .tab{flex-direction:row;padding:.7rem .9rem;border-bottom:none;border-radius:8px;gap:.7rem;width:100%;justify-content:flex-start;border-left:3px solid transparent}
  .tab--on{background:rgba(122,59,59,.05);border-left-color:var(--wine);color:var(--wine)}
  .tab--on::after{display:none}
  .lb__prev{left:.2rem}.lb__next{right:.2rem}
}

<script>

const stars=document.getElementById("stars");
const sctx=stars.getContext("2d");

function resizeStars(){
stars.width=innerWidth;
stars.height=innerHeight;
}
resizeStars();
window.addEventListener('resize',resizeStars);

const particles=[];
for(let i=0;i<220;i++){
particles.push({
x:Math.random()*innerWidth,
y:Math.random()*innerHeight,
r:Math.random()*2,
v:Math.random()*0.3+0.05
});
}

function animateStars(){
sctx.clearRect(0,0,stars.width,stars.height);

for(const p of particles){
p.y+=p.v;

if(p.y>innerHeight){
p.y=0;
}

const glow=sctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*6);
glow.addColorStop(0,'rgba(255,255,255,.95)');
glow.addColorStop(.35,'rgba(255,255,255,.25)');
glow.addColorStop(1,'rgba(255,255,255,0)');

sctx.fillStyle=glow;
sctx.beginPath();
sctx.arc(p.x,p.y,p.r*6,0,Math.PI*2);
sctx.fill();

sctx.fillStyle='rgba(255,255,255,.95)';
sctx.beginPath();
sctx.arc(p.x,p.y,p.r,0,Math.PI*2);
sctx.fill();
}

requestAnimationFrame(animateStars);
}

animateStars();

</script>
